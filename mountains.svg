<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Hatch pattern for stencil texture -->
    <pattern id="hatch1" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a96b0" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <pattern id="hatch2" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#7a85a0" stroke-width="0.7" opacity="0.65"/>
    </pattern>
    <pattern id="hatch3" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#6a7590" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <g opacity="0.45">
  <!-- Layer 5: farthest, lightest mountains -->
  <path d="M0 420 L80 340 L160 370 L240 290 L320 330 L400 260 L480 300 L560 240 L640 280 L720 210 L800 255 L880 200 L960 240 L1040 185 L1120 225 L1200 195 L1280 230 L1360 200 L1440 220 L1440 600 L0 600 Z"
        fill="none" stroke="#9aa5bc" stroke-width="1.2"/>

  <!-- Layer 4: distant mountains with hatch fill -->
  <path d="M0 460 L60 370 L130 400 L200 320 L280 360 L370 280 L450 330 L530 265 L620 305 L700 240 L780 285 L870 225 L950 270 L1040 215 L1120 260 L1200 230 L1300 265 L1380 240 L1440 255 L1440 600 L0 600 Z"
        fill="url(#hatch1)" stroke="#8a96b0" stroke-width="1.3"/>

  <!-- Detail lines on layer 4 ridges -->
  <path d="M370 280 L420 305 L450 330" fill="none" stroke="#8a96b0" stroke-width="0.9"/>
  <path d="M700 240 L740 265 L780 285" fill="none" stroke="#8a96b0" stroke-width="0.9"/>
  <path d="M1040 215 L1080 242 L1120 260" fill="none" stroke="#8a96b0" stroke-width="0.9"/>

  <!-- Layer 3: mid mountains -->
  <path d="M0 500 L70 400 L150 440 L230 355 L320 400 L420 310 L500 360 L590 290 L670 340 L760 270 L840 315 L930 255 L1010 300 L1100 250 L1180 290 L1260 260 L1340 295 L1440 270 L1440 600 L0 600 Z"
        fill="url(#hatch2)" stroke="#7a85a0" stroke-width="1.5"/>

  <!-- Detail lines on layer 3 -->
  <path d="M420 310 L460 335 L500 360" fill="none" stroke="#7a85a0" stroke-width="1"/>
  <path d="M590 290 L630 315 L670 340" fill="none" stroke="#7a85a0" stroke-width="1"/>
  <path d="M760 270 L800 292 L840 315" fill="none" stroke="#7a85a0" stroke-width="1"/>
  <path d="M930 255 L970 277 L1010 300" fill="none" stroke="#7a85a0" stroke-width="1"/>
  <!-- Cross hatching detail near peaks -->
  <path d="M230 355 L260 375 L290 360 L320 400" fill="none" stroke="#7a85a0" stroke-width="0.8"/>
  <path d="M1100 250 L1135 268 L1180 290" fill="none" stroke="#7a85a0" stroke-width="0.8"/>

  <!-- Layer 2: closer mountains, more detail -->
  <path d="M0 540 L90 430 L170 475 L260 380 L360 430 L460 345 L560 400 L660 325 L750 375 L850 300 L940 355 L1040 290 L1130 340 L1220 295 L1310 335 L1440 305 L1440 600 L0 600 Z"
        fill="url(#hatch3)" stroke="#5c6880" stroke-width="1.7"/>

  <!-- Stencil detail lines layer 2 -->
  <path d="M260 380 L300 405 L340 390 L360 430" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <path d="M460 345 L500 368 L530 355 L560 400" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <path d="M660 325 L695 348 L725 335 L750 375" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <path d="M850 300 L885 325 L915 312 L940 355" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <path d="M1040 290 L1078 315 L1108 302 L1130 340" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <path d="M1220 295 L1258 313 L1285 320 L1310 335" fill="none" stroke="#5c6880" stroke-width="1.1"/>
  <!-- Horizontal strata lines suggesting geological layers -->
  <path d="M90 430 L130 448 L170 475" fill="none" stroke="#5c6880" stroke-width="0.8"/>
  <path d="M170 475 L215 458 L260 380" fill="none" stroke="#5c6880" stroke-width="0.8"/>

  <!-- Layer 1: foreground hills, darkest -->
  <path d="M0 570 L100 490 L200 520 L300 465 L420 510 L520 455 L630 500 L740 450 L840 490 L960 445 L1060 480 L1160 450 L1280 475 L1440 455 L1440 600 L0 600 Z"
        fill="#e8ebf0" stroke="#4a5570" stroke-width="1.8"/>

  <!-- Foreground detail lines -->
  <path d="M300 465 L355 488 L420 510" fill="none" stroke="#4a5570" stroke-width="1.2"/>
  <path d="M520 455 L573 478 L630 500" fill="none" stroke="#4a5570" stroke-width="1.2"/>
  <path d="M740 450 L788 470 L840 490" fill="none" stroke="#4a5570" stroke-width="1.2"/>
  <path d="M960 445 L1008 463 L1060 480" fill="none" stroke="#4a5570" stroke-width="1.2"/>
  <path d="M1160 450 L1215 462 L1280 475" fill="none" stroke="#4a5570" stroke-width="1.2"/>
  <!-- Strata detail -->
  <path d="M100 490 L145 506 L200 520" fill="none" stroke="#4a5570" stroke-width="1"/>
  <path d="M200 520 L248 497 L300 465" fill="none" stroke="#4a5570" stroke-width="1"/>
  <path d="M840 490 L898 467 L960 445" fill="none" stroke="#4a5570" stroke-width="1"/>
  </g>
</svg>
